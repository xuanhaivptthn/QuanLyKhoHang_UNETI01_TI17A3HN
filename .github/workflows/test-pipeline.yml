name: Automated Testing Engine Pipeline (Data-Driven Allure)

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  automation-test:
    name: Run Allure NUnit & Playwright Data-Driven Engine
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Setup .NET Core SDK 10.0
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Cache NuGet Packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Restore Dependencies
      run: dotnet restore

    - name: Build Solution
      run: dotnet build --no-restore --configuration Release

    - name: Install Playwright Browsers & OS Dependencies
      run: |
        pwsh Tests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

    - name: Start Web Application
      env:
        ConnectionStrings__RemoteDb: ${{ secrets.REMOTE_DB_CONNECTION_STRING }}
      run: |
        dotnet run --project QuanLyKhoHang_UNETI01_TI17A3HN.csproj --configuration Release --no-build --urls "http://localhost:5009" &
        for i in {1..30}; do
          if curl -s http://localhost:5009/login > /dev/null; then
            echo "Web app is ready at http://localhost:5009!"
            break
          fi
          echo "Waiting for web app..."
          sleep 1
        done

    - name: Execute Automation Test Suites
      continue-on-error: true
      run: |
        dotnet test Tests/QuanLyKhoHang.Automation.csproj \
          --no-build \
          --configuration Release \
          --logger "console;verbosity=normal"

    - name: Generate Allure Report
      uses: simple-elf/allure-report-action@master
      if: always()
      id: allure-report
      with:
        allure_results: allure-results
        allure_report: allure-report
        allure_history: allure-history
        keep_reports: 20

    - name: Publish Test Report Artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: execution-allure-report
        path: allure-report/
        retention-days: 14
