name: Discord Push Notification & Build Check

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  notify:
    name: Notify Commits
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Send Discord notification for all commits
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DISCORD_ROLE_ID: ${{ secrets.DISCORD_ROLE_ID }}
          COMMITS_JSON: ${{ toJson(github.event.commits) }}
          HEAD_COMMIT_JSON: ${{ toJson(github.event.head_commit) }}
          AUTHOR: ${{ github.actor }}
          BRANCH: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          COMPARE_URL: ${{ github.event.compare }}
        run: node .github/workflows/discord-notify.js

  build:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore

      - name: Build project
        id: build_step
        run: dotnet build --no-restore --configuration Release

      - name: Install Playwright Browsers & OS Dependencies
        run: |
          pwsh Tests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: Start Web Application
        env:
          ConnectionStrings__RemoteDb: ${{ secrets.REMOTE_DB_CONNECTION_STRING }}
        run: |
          dotnet run --project QuanLyKhoHang_UNETI01_TI17A3HN.csproj --configuration Release --no-build --urls "http://localhost:5009" &
          for i in {1..30}; do
            if curl -s http://localhost:5009/login > /dev/null; then
              echo "Web app is ready at http://localhost:5009!"
              break
            fi
            echo "Waiting for web app..."
            sleep 1
          done

      - name: Run Automation tests
        id: test_step
        continue-on-error: true
        run: dotnet test Tests/QuanLyKhoHang.Automation.csproj --no-build --no-restore --configuration Release --logger "trx;LogFileName=test-results.trx"

      - name: Report Build Status to Discord
        if: always()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          BUILD_STATUS: ${{ steps.build_step.outcome }}
          AUTHOR: ${{ github.actor }}
          BRANCH: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          HEAD_COMMIT_JSON: ${{ toJson(github.event.head_commit) }}
          RUN_ID: ${{ github.run_id }}
          SERVER_URL: ${{ github.server_url }}
        run: node .github/workflows/discord-build-notify.js

      - name: Fail workflow if build failed
        if: steps.build_step.outcome != 'success'
        run: exit 1
